<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 AD B - Face Attendance</title>
    <link rel="stylesheet" href="static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <div class="header-badge">S3 AD B • Room 201</div>
            <h1>Face Attendance</h1>
            <nav>
                <button onclick="showSection('attendance')" id="nav-attendance" class="active">Mark Attendance</button>
                <button onclick="showSection('register')" id="nav-register">Register</button>
                <button onclick="showSection('dashboard')" id="nav-dashboard">Dashboard</button>
            </nav>
        </header>

        <main>
            <!-- Attendance Section -->
            <section id="attendance-section" class="active-section">
                <!-- Live Class Schedule Card -->
                <div id="live-class-banner" class="live-banner">
                    <div class="live-indicator">
                        <span class="dot"></span>
                        <span id="live-status-text">Loading Timetable...</span>
                    </div>
                    <div id="live-subject" class="live-subject">-</div>
                    <div id="live-faculty" class="live-faculty">-</div>
                    <div id="live-time" class="live-time">-</div>
                </div>

                <div class="period-select-wrapper">
                    <label for="period-select">Period / Subject:</label>
                    <select id="period-select" class="glass-select">
                        <option value="auto">⚡ Auto (Current Active Period)</option>
                        <option value="Period 1">Period 1</option>
                        <option value="Period 2">Period 2</option>
                        <option value="Period 3">Period 3</option>
                        <option value="Period 4">Period 4</option>
                        <option value="Period 5">Period 5</option>
                        <option value="Period 6">Period 6</option>
                        <option value="Period 7">Period 7</option>
                    </select>
                </div>

                <div class="camera-container">
                    <video id="attendance-video" autoplay playsinline></video>
                    <canvas id="attendance-canvas" style="display:none;"></canvas>
                </div>
                <button id="btn-take-attendance" class="primary-btn">Mark Present</button>
                <div id="attendance-status" class="status-msg"></div>
            </section>

            <!-- Registration Section -->
            <section id="register-section">
                <h2>Register New Student</h2>
                <input type="text" id="student-name" placeholder="Enter Full Name" class="glass-input">
                <div class="camera-container">
                    <video id="register-video" autoplay playsinline></video>
                    <canvas id="register-canvas" style="display:none;"></canvas>
                </div>
                <button id="btn-register" class="primary-btn">Register Face</button>
                <div id="register-status" class="status-msg"></div>
            </section>

            <!-- Dashboard Section -->
            <section id="dashboard-section">
                <h2>Period Attendance Log</h2>
                <div class="table-container">
                    <table id="records-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Subject</th>
                                <th>Period</th>
                                <th>Faculty</th>
                                <th>Date</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Records will be injected here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
